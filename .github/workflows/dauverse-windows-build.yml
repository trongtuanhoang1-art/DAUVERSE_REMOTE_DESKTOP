name: DAUVERSE Windows Release Build (Manual Dispatch Only)

# Security & Zero-Cost Governance (Sections 06, 08 & 30 — RC2 Hardened for F15 & A01-A04):
# - Manual workflow_dispatch ONLY (zero automatic push/PR/cron/tag runner minutes).
# - Concurrency cancel-in-progress prevents accidental duplicate Windows runner jobs.
# - Least-privilege permissions (contents: read).
# - All GitHub Actions pinned to full 40-char commit SHAs (Swatinem/rust-cache v2.9.3 for Cache v2).
# - Exact Rust (1.100.0), Flutter (3.50.0), LLVM (17.0.6), and vcpkg (9e593bb1...) versions pinned.
# - Full unshallow checkout (fetch-depth: 0) so self-contained git bundle passes bare repo verification.
# - Never auto-publishes public GitHub Releases; uploads complete clean-room-verified RC2 QA archive artifact.

on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: "Run Rust base/dauverse:: and Flutter UI test suites (required for RC eligibility)"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: dauverse-windows-build-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VCPKG_ROOT: "C:\\vcpkg"
  VCPKG_DEFAULT_HOST_TRIPLET: "x64-windows-static"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  RUST_VERSION: "1.100.0"
  FLUTTER_VERSION: "3.50.0"
  LLVM_VERSION: "17.0.6"

jobs:
  build-windows-x64:
    name: Build & Verify DAUVERSE Remote V1 RC2 (Windows x64)
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Configure Git to preserve exact LF bytes before checkout
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout full repository history and pinned submodules
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        env:
          GIT_CONFIG_COUNT: "2"
          GIT_CONFIG_KEY_0: "core.autocrlf"
          GIT_CONFIG_VALUE_0: "false"
          GIT_CONFIG_KEY_1: "core.eol"
          GIT_CONFIG_VALUE_1: "lf"
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Pre-verify exact LF bytes, Codex QA report SHA-256, and packaging inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git config --local core.autocrlf false
          git config --local core.eol lf
          git -C libs/hbb_common config --local core.autocrlf false
          git -C libs/hbb_common config --local core.eol lf
          $ErrorActionPreference = "Continue"
          git config --global --unset-all core.autocrlf 2>$null
          git config --global --unset-all core.eol 2>$null
          $global:LASTEXITCODE = 0
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $ExpectedCodexSha = "f07b61edbd82a376cc5e3f854d72d0cc3331735094bc0631e37fbc9ebc60a913"
          $ActualCodexSha = (Get-FileHash -LiteralPath "QA/DAUVERSE_REMOTE_V1_INDEPENDENT_QA_REPORT.md" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($ActualCodexSha -ne $ExpectedCodexSha) {
            throw "PREFLIGHT_ABORT: QA/DAUVERSE_REMOTE_V1_INDEPENDENT_QA_REPORT.md SHA-256 mismatch after checkout! Expected $ExpectedCodexSha, got $ActualCodexSha"
          }
          $ExpectedCodexReQaSha = "c23d36e7d83b2fb1402238d8a8501b9de899fcd94b2774155b6a602fd77fb954"
          $ActualCodexReQaSha = (Get-FileHash -LiteralPath "QA/DAUVERSE_REMOTE_V1_RC2_INDEPENDENT_REQA_REPORT.md" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($ActualCodexReQaSha -ne $ExpectedCodexReQaSha) {
            throw "PREFLIGHT_ABORT: QA/DAUVERSE_REMOTE_V1_RC2_INDEPENDENT_REQA_REPORT.md SHA-256 mismatch after checkout! Expected $ExpectedCodexReQaSha, got $ActualCodexReQaSha"
          }
          foreach ($reqFile in @(
            "FINDINGS_REMEDIATION_MATRIX.md",
            "QA/CODEX_REQA_WINDOWS_RC2_HANDOFF.md",
            "DAUVERSE_REMOTE_V1_RC3_SOURCE_REVIEW_HANDOFF.md",
            "FEATURE_ACCEPTANCE_MATRIX.md",
            "HUONG_DAN_BOSS.md",
            "LICENSE",
            "LICENCE",
            "THIRD_PARTY_NOTICES",
            "LICENSE_COMPLIANCE_REPORT.md",
            "UPSTREAM_MANIFEST.json",
            "SBOM.spdx.json"
          )) {
            if (-not (Test-Path -LiteralPath $reqFile)) {
              throw "PREFLIGHT_ABORT: Missing required packaging input: $reqFile"
            }
          }
          foreach ($manifestPath in @("SHA256_MANIFEST.txt", "ARTIFACTS/SHA256_MANIFEST.txt")) {
            $lines = @(Get-Content -LiteralPath $manifestPath | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
            foreach ($line in $lines) {
              if ($line -notmatch '^([0-9a-f]{64})\s\s(.+)$') {
                throw "PREFLIGHT_ABORT: Malformed line in ${manifestPath}: $line"
              }
              $exp = $Matches[1]
              $rel = $Matches[2]
              if (-not (Test-Path -LiteralPath $rel)) {
                throw "PREFLIGHT_ABORT: Missing file listed in ${manifestPath}: $rel"
              }
              $act = (Get-FileHash -LiteralPath $rel -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($act -ne $exp) {
                throw "PREFLIGHT_ABORT: SHA-256 mismatch after checkout for $rel (expected $exp, got $act)"
              }
            }
          }
          Write-Host "PREFLIGHT OK: Codex QA report SHA-256 ($ActualCodexSha) and all $($lines.Count) SHA256_MANIFEST.txt entries verified byte-for-byte."

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install pinned Rust toolchain (${{ env.RUST_VERSION }})
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - name: Cache Rust build artifacts (GitHub Actions Cache v2)
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: dauverse-win-x64-rc2
          cache-on-failure: true

      - name: Export GitHub Actions cache environment variables for vcpkg
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Setup vcpkg with GitHub Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          runVcpkgInstall: false
          doNotCache: false

      - name: Install vcpkg static Windows dependencies (single x64-windows-static triplet)
        shell: bash
        run: |
          set -euo pipefail
          "$VCPKG_ROOT/vcpkg.exe" install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"
          echo "ACTIONS_CACHE_URL=" >> "$GITHUB_ENV"

      - name: Install Flutter SDK (${{ env.FLUTTER_VERSION }})
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64
          cache: true

      - name: Generate flutter_rust_bridge bindings & apply Dart 3 FFI patch
        shell: bash
        env:
          VCPKG_INSTALLED_ROOT: C:\vcpkg\installed
        run: |
          set -euo pipefail
          if [ ! -f "./flutter/lib/generated_bridge.dart" ] || [ ! -f "./src/bridge_generated.rs" ]; then
            cargo install cargo-expand --version 1.0.95 --locked
            cargo install flutter_rust_bridge_codegen --version 1.80.1 --features "uuid" --locked
            pushd flutter
            flutter pub get
            popd
            flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
            cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h
            sed -i 's/ffi.NativeFunction<ffi.Bool Function(DartPort/ffi.NativeFunction<ffi.Uint8 Function(DartPort/g' ./flutter/lib/generated_bridge.dart
          fi

      - name: Install Exact Pinned NSIS v3.11 (F15 Reproducibility Pin) and Build Binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _win_out/LOGS
          pwsh -NoProfile -NonInteractive -Command '
            $ErrorActionPreference = "Stop"
            $NeedNsis311 = $true
            $Candidates = @("C:\Program Files (x86)\NSIS\makensis.exe", "C:\Program Files\NSIS\makensis.exe")
            $Cmd = Get-Command "makensis.exe" -ErrorAction SilentlyContinue
            if ($Cmd) { $Candidates = @($Cmd.Source) + $Candidates }
            foreach ($cand in $Candidates) {
              if (Test-Path -LiteralPath $cand) {
                $ver = (& $cand /VERSION 2>&1 | Out-String).Trim()
                if ($ver -eq "v3.11") {
                  $NeedNsis311 = $false
                  Write-Host "Verified exact pinned NSIS version: $ver ($cand)"
                  break
                }
              }
            }
            if ($NeedNsis311) {
              choco install nsis --version=3.11 -y --force --allow-downgrade --no-progress
              if ($LASTEXITCODE -ne 0) {
                throw "Chocolatey failed installing pinned NSIS v3.11 (exit $LASTEXITCODE)"
              }
            }
            $ResolvedNsis = $null
            $CmdAfter = Get-Command "makensis.exe" -ErrorAction SilentlyContinue
            $VerifyList = @("C:\Program Files (x86)\NSIS\makensis.exe", "C:\Program Files\NSIS\makensis.exe")
            if ($CmdAfter) { $VerifyList = @($CmdAfter.Source) + $VerifyList }
            foreach ($cand in $VerifyList) {
              if (Test-Path -LiteralPath $cand) {
                $verAfter = (& $cand /VERSION 2>&1 | Out-String).Trim()
                if ($verAfter -eq "v3.11") {
                  $ResolvedNsis = $cand
                  Write-Host "Post-check confirmed exact NSIS v3.11: $cand"
                  break
                }
              }
            }
            if (-not $ResolvedNsis) {
              throw "F15_NSIS_PIN_FAILED: makensis.exe /VERSION did not resolve to exact v3.11 after setup"
            }
          '
          if [ "${{ inputs.run_tests }}" = "true" ]; then
            pwsh -NoProfile -NonInteractive -File ./scripts/windows/build_windows_release.ps1 -WorkspaceRoot "$PWD/_win_out" -UseRepoTargetDir -SkipVcpkgInstall 2>&1 | tee _win_out/LOGS/GITHUB_ACTIONS_BUILD_CONSOLE.log
          else
            pwsh -NoProfile -NonInteractive -File ./scripts/windows/build_windows_release.ps1 -WorkspaceRoot "$PWD/_win_out" -UseRepoTargetDir -SkipVcpkgInstall -SkipTests 2>&1 | tee _win_out/LOGS/GITHUB_ACTIONS_BUILD_CONSOLE.log
          fi

      - name: Verify Coexistence, Startup, 3-Process DPAPI/HMAC/PIN Matrix, Rollback & Uninstaller
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _win_out/LOGS
          pwsh -NoProfile -NonInteractive -File ./scripts/windows/verify_and_package_windows_rc.ps1 -ReleaseDir "$PWD/_win_out/RELEASE" -RepoRoot "$PWD" -LogsDir "$PWD/_win_out/LOGS" -AuthorizedSandbox 2>&1 | tee _win_out/LOGS/GITHUB_ACTIONS_VERIFY_CONSOLE.log

      - name: Package & Clean-Room Verify Complete Windows RC2 QA Archive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          ./scripts/windows/package_complete_rc2_qa_archive.ps1 -RepoRoot "$PWD" -WorkspaceRoot "$PWD/_win_out" -OutputDir "$PWD/_win_out/HANDOFF"
          if ($LASTEXITCODE -ne 0) { throw "package_complete_rc2_qa_archive.ps1 exited with $LASTEXITCODE" }

      - name: Upload Complete Windows RC2 QA Package & Standalone Binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DAUVERSE_REMOTE_DESKTOP_V1_WINDOWS_RC2_COMPLETE_QA
          path: |
            _win_out/HANDOFF/DAUVERSE_REMOTE_DESKTOP_V1_WINDOWS_RC2_COMPLETE_QA.zip
            _win_out/HANDOFF/DAUVERSE_REMOTE_DESKTOP_V1_WINDOWS_RC2_COMPLETE_QA.zip.sha256
            _win_out/HANDOFF/DAUVERSE_REMOTE_DESKTOP_V1_SETUP.exe
            _win_out/HANDOFF/DAUVERSE_REMOTE_DESKTOP_V1_PORTABLE.exe
            _win_out/HANDOFF/FINAL_HANDOFF_SHA256_MANIFEST.txt
          if-no-files-found: error
